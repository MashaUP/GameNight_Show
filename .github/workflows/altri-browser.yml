# Prove su Firefox e WebKit (il motore di Safari) — 2.1, idea 75.
# Solo a mano (scheda Actions › "Altri browser" › Run workflow): sono un controllo delle differenze
# tra browser, non un esame per pubblicare, così la "Verifica" a ogni caricamento resta pulita.
name: Altri browser

on:
  workflow_dispatch:

jobs:
  altri-browser:
    # Ubuntu 24.04 fisso (2.1): da ottobre 2026 "ubuntu-latest" passa a Ubuntu 26, che Playwright 1.56 non riconosceva
    # ("Cannot install dependencies for ubuntu26.04-x64"). Playwright 1.63 (lo stesso delle prove in locale) funziona su entrambi.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa gli strumenti di prova
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Installa Playwright (${{ matrix.browser }})
        run: |
          python -m pip install --quiet playwright==1.63.0 pillow
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Prove nel browser (${{ matrix.browser }})
        env:
          GN_BROWSER: ${{ matrix.browser }}
        run: python tests/e2e/run.py i18n links hub fit endnight identity20 show21
      - name: Registri delle prove
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prove-${{ matrix.browser }}
          path: tests/e2e/out/*.log
          retention-days: 7
