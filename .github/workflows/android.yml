# App Android: si costruisce SOLO quando pubblichi tu una release su GitHub.
# I caricamenti di codice, le modifiche ai link e ogni altro push NON avviano questo lavoro
# (per quelli c'è solo "Verifica", che non tocca le Releases).
#
# Come pubblicare una versione (dopo aver caricato i file con il nuovo numero in version.json):
#   Releases › Draft a new release › Choose a tag › scrivi v1.5.0 › "Create new tag: v1.5.0 on publish"
#   › titolo e testo come vuoi › Publish release
# Il tag deve corrispondere a "version" in version.json (v1.5 vale come 1.5.0), altrimenti il lavoro si ferma.
#
# Cosa fa il lavoro, senza creare né modificare release (quindi nessun evento in più per i webhook):
#   - aggiunge GameNight-Show.apk e GameNight-Show.json alla TUA release (l'impronta SHA-256 la calcola GitHub);
#   - l'app e la pagina di download leggono l'ultima release pubblicata:
#       https://github.com/<utente>/<repository>/releases/latest/download/GameNight-Show.apk
#   - solo finché esiste la vecchia release "app-android": aggiorna anche quella, perché le app 1.3
#     già installate la leggono ancora. Quando tutti hanno la 1.5 o più recente, cancellala (vedi README).
name: App Android

on:
  release:
    types: [published]

permissions:
  contents: write

# Una pubblicazione alla volta, senza interrompere quella in corso.
concurrency:
  group: app-android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    # Solo release con un tag di versione (v1.5.0, v1.5), pubblicate dal proprietario del repository.
    if: startsWith(github.event.release.tag_name, 'v') && github.actor == github.repository_owner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Il tag deve essere la versione scritta in version.json: niente APK con il numero sbagliato.
      - name: Tag e versione
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ver="$(node -p "require('./version.json').version")"
          norm() { local v="${1#v}"; case "$v" in *.*.*) echo "$v";; *.*) echo "$v.0";; *) echo "$v.0.0";; esac; }
          if [ "$(norm "$TAG")" != "$(norm "$ver")" ]; then
            echo "::error::Il tag $TAG non corrisponde alla versione $ver di version.json. Cancella la release e il tag, correggi version.json (o il tag) e pubblica di nuovo."
            exit 1
          fi
          echo "Versione $ver, tag $TAG"

      # Gli stessi controlli di "Verifica" (versioni, file, traduzioni, regole del database, link):
      # se qualcosa non va, l'APK non viene pubblicata.
      - name: Controlli prima della pubblicazione
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm test

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # L'Android SDK è già installato sui server di GitHub (ubuntu-latest): basta dirlo a Gradle.
      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $sdk"
          test -n "$sdk" && test -d "$sdk"
          echo "sdk.dir=$sdk" > android-app/android/local.properties
          mkdir -p "$RUNNER_TEMP/log"

      - name: Indirizzi pubblici del sito e dell'APK
        id: urls
        env:
          SITE_VAR: ${{ vars.SITE_URL }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          name="${REPO#*/}"
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$SITE_VAR" ]; then site="$SITE_VAR"; else site="https://${owner}.github.io/${name}/"; fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "apk=https://github.com/${REPO}/releases/latest/download/GameNight-Show.apk" >> "$GITHUB_OUTPUT"
          echo "Sito: $site"

      - name: Strumenti dell'app
        working-directory: android-app
        run: npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/log/npm.txt"; test ${PIPESTATUS[0]} -eq 0

      - name: Copia del sito dentro l'app
        working-directory: android-app
        env:
          SITE_URL: ${{ steps.urls.outputs.site }}
          APK_URL: ${{ steps.urls.outputs.apk }}
        run: |
          set -o pipefail
          node scripts/prepare-www.mjs 2>&1 | tee "$RUNNER_TEMP/log/www.txt"
          npx cap sync android 2>&1 | tee -a "$RUNNER_TEMP/log/www.txt"

      - name: Chiave di firma personale (se è nei Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Uso la chiave personale dai Secrets."
          else
            echo "Nessuna chiave nei Secrets: uso la chiave di prova in android-app/keystore."
          fi

      - name: Costruzione dell'APK
        working-directory: android-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/log/gradle.txt"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/GameNight-Show.apk"

      # Se qualcosa va storto, le ultime righe dei registri finiscono nel riepilogo della pagina del lavoro
      # (visibile anche senza accedere a GitHub): così si capisce subito cosa sistemare.
      - name: Riepilogo dell'errore
        if: failure()
        run: |
          {
            echo "## Cosa è andato storto"
            for f in "$RUNNER_TEMP"/log/*.txt; do
              [ -f "$f" ] || continue
              echo "### $(basename "$f")"
              echo '```'
              grep -v '^\s*$' "$f" | grep -iE 'error|failed|what went wrong|exception|could not|denied|not found' | head -40
              echo '...'
              tail -n 40 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Dati della build per il controllo degli aggiornamenti nell'app e nella pagina scarica.html:
      # versione, numero di build, impronta SHA-256, dimensione, data e novità in italiano e inglese (da version.json).
      - name: Dati della versione
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const v = JSON.parse(fs.readFileSync("version.json", "utf8"));
            const apk = fs.readFileSync("GameNight-Show.apk");
            const clean = (l) => (Array.isArray(l) ? l : []).slice(0, 12).map((n) => String(n).replace(/-->/g, "→").slice(0, 240));
            const meta = {
              app: "GameNight Show", version: v.version, versionCode: Number(process.env.GITHUB_RUN_NUMBER),
              sha256: crypto.createHash("sha256").update(apk).digest("hex"), size: apk.length,
              // Novità in italiano (notes, letto anche dalle app 1.3) e in inglese (notesEn, dalla 1.4)
              date: new Date().toISOString(), notes: clean(Array.isArray(v.notes) ? v.notes : v.notes && v.notes.it), notesEn: clean(v.notesEn || (v.notes && v.notes.en)),
              minAndroid: v.minAndroid || "7.0", commit: process.env.GITHUB_SHA
            };
            if (!/^\d+\.\d+(\.\d+)?/.test(meta.version) || !(meta.versionCode > 0) || !meta.size) throw new Error("dati della versione non validi");
            fs.writeFileSync("GameNight-Show.json", JSON.stringify(meta, null, 2) + "\n");
            console.log(`Versione ${meta.version}, build ${meta.versionCode}, ${meta.size} byte, SHA-256 ${meta.sha256}`);
          '

      - uses: actions/upload-artifact@v7
        with:
          name: GameNight-Show-apk
          path: |
            GameNight-Show.apk
            GameNight-Show.json

      # L'APK va nella release che hai pubblicato tu. Si caricano solo file (con l'etichetta che dice
      # versione e build): la release non viene modificata, quindi nessun evento "edited" per i webhook.
      - name: APK nella tua release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ver="$(node -p "require('./version.json').version")"
          gh release upload "$TAG" "GameNight-Show.apk#GameNight Show ${ver} · build ${GITHUB_RUN_NUMBER}" --clobber
          gh release upload "$TAG" "GameNight-Show.json#Dati della build ${GITHUB_RUN_NUMBER}" --clobber
          echo "APK caricata nella release $TAG"

      # Ponte per le app 1.3 già installate, che leggono la vecchia release "app-android".
      # Gira solo se quella release esiste ancora e solo per le versioni definitive (non le anteprime).
      # Cancella "app-android" (release e tag) quando tutti hanno la 1.5 o più recente: da lì questo passo si salta.
      - name: Ponte per le app 1.3 (release app-android)
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view app-android >/dev/null 2>&1; then
            echo "Nessuna release app-android: niente da fare."
            exit 0
          fi
          ver="$(node -p "require('./version.json').version")"
          meta="$(node -p "JSON.stringify(require('./GameNight-Show.json'))")"
          sha="$(node -p "require('./GameNight-Show.json').sha256")"
          notes="$(printf 'Release di compatibilità per le app GameNight Show 1.3: porta alla versione %s. Le versioni nuove sono nelle release con il tag vX.Y.Z.\n\nSHA-256: %s\n\n<!-- gamenight-apk: %s -->' "$ver" "$sha" "$meta")"
          gh release upload app-android GameNight-Show.apk --clobber
          gh release upload app-android GameNight-Show.json --clobber
          gh release edit app-android --title "App Android ${ver}" --notes "$notes" --latest=false
