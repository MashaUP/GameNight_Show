# Controlli automatici a ogni caricamento su GitHub (scheda "Actions"):
# 1. versioni allineate, file del sito presenti, moduli JavaScript senza errori, traduzioni complete,
#    regole del database e proxy di BoardGameGeek;
# 2. prove nel browser (Chromium) dei flussi principali, con un finto Firebase e con le regole vere.
# Tutto gratuito (runner standard di GitHub).
name: Verifica

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Installa gli strumenti di prova
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Controlli e regole
        working-directory: tests
        run: npm test
      - name: Proxy BoardGameGeek
        run: node --test bgg-proxy/test/worker.test.mjs

  browser:
    runs-on: ubuntu-latest
    needs: verifica
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installa gli strumenti di prova
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Installa Playwright e Chromium
        run: |
          python -m pip install --quiet playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium
      - name: Prove nel browser
        run: python tests/e2e/run.py --ci
      - name: Registri delle prove (se qualcosa non va)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prove-browser
          path: tests/e2e/out/*.log
          retention-days: 7
