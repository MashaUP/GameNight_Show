# Controlli automatici a ogni caricamento su GitHub (scheda "Actions"):
# 1. versioni allineate, file del sito presenti, moduli JavaScript senza errori, traduzioni complete,
#    regole del database e proxy di BoardGameGeek;
# 2. prove nel browser (Chromium) dei flussi principali, con un finto Firebase e con le regole vere.
# Tutto gratuito (runner standard di GitHub).
name: Verifica

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifica:
    # Ubuntu 24.04 fisso (2.1): da ottobre 2026 "ubuntu-latest" passa a Ubuntu 26, che Playwright 1.56 non riconosceva
    # ("Cannot install dependencies for ubuntu26.04-x64"). Playwright 1.63 (lo stesso delle prove in locale) funziona su entrambi.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installa gli strumenti di prova
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Controlli e regole
        working-directory: tests
        run: npm test
      - name: Proxy BoardGameGeek
        run: node --test bgg-proxy/test/worker.test.mjs

  browser:
    # Ubuntu 24.04 fisso (2.1): da ottobre 2026 "ubuntu-latest" passa a Ubuntu 26, che Playwright 1.56 non riconosceva
    # ("Cannot install dependencies for ubuntu26.04-x64"). Playwright 1.63 (lo stesso delle prove in locale) funziona su entrambi.
    runs-on: ubuntu-24.04
    needs: verifica
    # 2.1: le prove sono cresciute (identity20, show21): circa 10-12 minuti, margine per i ritentativi
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa gli strumenti di prova
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Installa Playwright e Chromium
        run: |
          python -m pip install --quiet playwright==1.63.0 pillow
          python -m playwright install --with-deps chromium
      - name: Prove nel browser
        run: python tests/e2e/run.py --ci
      - name: Registri delle prove (se qualcosa non va)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prove-browser
          path: tests/e2e/out/*.log
          retention-days: 7
